<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bathroom Style Designer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700;800;900&display=swap">
<style>
/* Henry's Improvements look: black, white line work, blueprint grid */
:root{
  --bg:#000000; --panel:#050608; --ink:#ffffff; --silver:#cbd5e1; --muted:#94a3b8;
  --line:rgba(255,255,255,0.16); --line-2:rgba(255,255,255,0.10); --accent:#ffffff;
  --f:'Fira Sans', Arial, sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0;font-family:var(--f);-webkit-font-smoothing:antialiased;line-height:1.6}
.dz{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#000}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line-2)}
.style-btn{appearance:none;background:transparent;border:0;border-left:1px solid var(--line-2);color:var(--muted);cursor:pointer;padding:18px 10px;font:800 0.78rem var(--f);letter-spacing:.16em;text-transform:uppercase;transition:color .3s,background-color .3s}
.style-btn:first-child{border-left:0}
.style-btn:hover{color:#fff}
.style-btn[aria-pressed="true"]{color:#000;background:#fff}
.style-btn:focus-visible,.pill:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.mood{margin:0;padding:16px 22px;text-align:center;color:var(--silver);font-weight:300;font-size:.96rem;border-bottom:1px solid var(--line-2)}
.stage{position:relative;aspect-ratio:16/10;width:100%;max-width:100%;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(80% 90% at 50% 40%,#11161a,#050608 70%)}
.stage canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y;cursor:grab}
.plan-layer{position:absolute;inset:0;padding:18px;background:linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,#050608;display:grid;place-items:center}
.plan-layer svg{width:100%;height:100%;display:block}
.plan-layer svg text{font-family:var(--f);font-weight:700;fill:#fff}
.badge{position:absolute;top:14px;left:14px;z-index:5;display:inline-flex;gap:8px;align-items:center;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:7px 14px;font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.badge b{font-weight:900}
.mode{position:absolute;top:14px;right:14px;z-index:5;display:flex;border:1px solid rgba(255,255,255,.35);border-radius:50px;overflow:hidden;background:rgba(0,0,0,.6)}
.views{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 28px)}
.pill{appearance:none;border:0;background:transparent;color:#fff;font:700 .66rem var(--f);letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.views .pill{border:1px solid rgba(255,255,255,.3);border-radius:50px;background:rgba(0,0,0,.55)}
.pill[aria-pressed="true"]{background:#fff!important;color:#000}
.hint{display:none}
.plan-layer[hidden],.views[hidden]{display:none!important}
.specs-row{display:grid;grid-template-columns:1.25fr 1fr 1fr;border-top:1px solid var(--line-2)}
.specs-row>div{padding:22px 22px 24px;border-left:1px solid var(--line-2);min-width:0}
.specs-row>div:first-child{border-left:0}
.lab{margin:0 0 12px;font-size:.7rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.specs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.specs li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start}
.sw{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.35);margin-top:3px}
.what{font-weight:600;font-size:.9rem;line-height:1.35}
.where{color:var(--muted);font-size:.8rem;font-weight:300}
.qty{display:none}
.finish{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.finish div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.finish div span:first-child{color:var(--muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.14em;font-weight:700;padding-top:2px}
.finish div span:last-child{text-align:right;font-weight:300}
#s-code{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--silver);font-size:.86rem;font-weight:300}
#plan-notes{display:none}
.foot{margin:0;padding:14px 22px;border-top:1px solid var(--line-2);font-size:.74rem;color:rgba(148,163,184,.85);font-weight:300;text-align:center}
@media (max-width:760px){
  .style-btn{padding:15px 4px;font-size:.64rem;letter-spacing:.08em}
  .stage{aspect-ratio:1/1}
  .specs-row{grid-template-columns:minmax(0,1fr)}
  .specs-row>div{border-left:0;border-top:1px solid var(--line-2)}
  .specs-row>div:first-child{border-top:0}
  .pill{font-size:.6rem;padding:6px 10px;letter-spacing:.08em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.suppliers{display:flex;flex-wrap:wrap;gap:10px 30px;align-items:center;justify-content:center;padding:18px 22px;border-top:1px solid rgba(255,255,255,0.10)}
.sup-lab{font-size:.68rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#94a3b8}
.brand{font-weight:800;font-size:.84rem;letter-spacing:.14em;text-transform:uppercase;color:#fff}
</style>
</head><body>

    <button class="style-btn" id="btn-modern" data-style="modern" aria-pressed="true">Modern Marble</button>

</div>

<script>
(function(){
const stage = document.getElementById('stage');
if(!window.THREE){ stage.insertAdjacentHTML('beforeend','<div class="err">The 3D viewer could not load. Check your connection and reload the page.</div>'); return; }

/* ---------- Room in inches: x = 96 (length), z = 60 (width), y = 96 (height) ---------- */
const L=96, W=60, H=96, TILE_H=84;

/* ---------- Seeded random so textures stay the same between loads ---------- */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,amt){ const [r,g,b]=hex2rgb(h); const f=v=>Math.max(0,Math.min(255,Math.round(v+amt))); return `rgb(${f(r)},${f(g)},${f(b)})`; }

/* Each texture canvas represents `span` inches square; repeat set from surface size. */
const PX=1024;
function makeTex(opts){
  const c=document.createElement('canvas'); c.width=c.height=PX; const g=c.getContext('2d');
  const r=rng(opts.seed||7); const s=PX/opts.span;
  g.fillStyle=opts.grout; g.fillRect(0,0,PX,PX);
  const gw=Math.max(1.5,(opts.groutIn||0.125)*s);
  const fillPiece=(path)=>{ g.save(); path(); g.clip(); g.fillStyle=shade(opts.base,(r()-0.5)*(opts.vary||10)); g.fillRect(0,0,PX,PX); g.restore(); };
  const rect=(x,y,w,h)=>fillPiece(()=>{ g.beginPath(); g.rect(x*s+gw/2,y*s+gw/2,w*s-gw,h*s-gw); });
  const p=opts.pattern;
  if(p==='grid'||p==='brick'||p==='stack'){
    const tw=opts.tw, th=opts.th;
    for(let row=0,y=0;y<opts.span;row++,y+=th){
      const off=(p==='brick'&&row%2)?tw/2:0;
      for(let x=-off;x<opts.span;x+=tw) rect(x,y,tw,th);
    }
  } else if(p==='herringbone'){
    const a=opts.tw, Lp=opts.th; // a = width, Lp = length
    g.save(); g.translate(PX/2,PX/2); g.rotate(Math.PI/4); g.translate(-PX,-PX);
    const S2=opts.span*2.2;
    for(let k=-60;k<60;k++) for(let m=-12;m<12;m++){
      const ox=m*Lp, oy=-m*Lp;
      const hx=k*a+ox, hy=k*a+oy;
      if(hx<-Lp||hx>S2+Lp||hy<-Lp||hy>S2+Lp) continue;
      rect(hx,hy,Lp,a); rect(hx-a,hy,a,Lp);
    }
    g.restore();
  } else if(p==='hex'){
    const R=opts.tw/2, hh=Math.sqrt(3)*R;
    for(let col=0,x=0;x<opts.span+R*2;col++,x+=1.5*R){
      for(let y=(col%2?hh/2:0)-hh;y<opts.span+hh;y+=hh){
        fillPiece(()=>{ g.beginPath(); for(let i=0;i<6;i++){ const ang=Math.PI/3*i; const rr=R*s-gw/2; g.lineTo(x*s+Math.cos(ang)*rr,y*s+Math.sin(ang)*rr);} g.closePath(); });
      }
    }
  }
  // veining / speckle on top of the pieces, leaving grout lines visible
  if(opts.veins){
    g.save(); g.globalCompositeOperation='source-atop';
    for(let i=0;i<opts.veins.count;i++){
      g.strokeStyle=opts.veins.color; g.globalAlpha=0.25+r()*0.5; g.lineWidth=0.6+r()*opts.veins.width;
      g.beginPath(); let x=r()*PX, y=r()*PX; g.moveTo(x,y);
      for(let k=0;k<6;k++){ const nx=x+(r()-0.3)*PX*0.35, ny=y+(r()-0.5)*PX*0.25; g.quadraticCurveTo((x+nx)/2+(r()-0.5)*80,(y+ny)/2+(r()-0.5)*80,nx,ny); x=nx; y=ny; }
      g.stroke();
    }
    g.restore();
  }
  if(opts.grain){
    g.save(); g.globalCompositeOperation='source-atop';
    for(let i=0;i<opts.grain.n;i++){ g.strokeStyle=opts.grain.color; g.globalAlpha=0.06+r()*0.2; g.lineWidth=0.6+r()*2; g.beginPath(); let y=r()*PX; g.moveTo(0,y); for(let x=0;x<=PX;x+=40){ y+=(r()-0.5)*5; g.lineTo(x,y);} g.stroke(); }
    g.restore();
  }
  if(opts.speckle){
    for(let i=0;i<opts.speckle.n;i++){ g.globalAlpha=0.08+r()*0.18; g.fillStyle=r()>0.5?opts.speckle.a:opts.speckle.b; const rr=0.5+r()*opts.speckle.size; g.beginPath(); g.arc(r()*PX,r()*PX,rr,0,7); g.fill(); }
    g.globalAlpha=1;
  }
  // regrout lines on top so speckle doesn't cover joints in grids
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; t.encoding=THREE.sRGBEncoding;
  t.userData={span:opts.span}; return t;
}
function woodTex(base,dark,seed){
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d'); const r=rng(seed);

  for(let i=0;i<140;i++){ g.strokeStyle=dark; g.globalAlpha=0.05+r()*0.18; g.lineWidth=0.5+r()*2.5; g.beginPath(); let y=r()*512; g.moveTo(0,y); for(let x=0;x<=512;x+=32){ y+= (r()-0.5)*6; g.lineTo(x,y);} g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; return t;
}
function texFor(tex,w,h){ const t=tex.clone(); t.needsUpdate=true; t.repeat.set(w/tex.userData.span,h/tex.userData.span); return t; }

};
const CODE={

/* ---------- Three.js setup ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,4/3,1,2000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=40; controls.maxDistance=420;

  rect(31,28.5,30,21,`fill="none" stroke="${mut}" stroke-width=".35" stroke-dasharray="1.4 1"`); text(46,40,'21″ MIN CLEAR','font-size="2.6" fill="var(--muted)"');

  if(S.vanity.kind==='pedestal'){ o.push(`<ellipse cx="74" cy="8" rx="11" ry="8.5" ${st}/>`); o.push(`<ellipse cx="74" cy="9" rx="7.5" ry="5.5" ${st}/>`); text(74,21,'PEDESTAL SINK'); }
  else { rect(63,0,30,21,`fill="${S.vanity.wood?S.vanity.wood[0]:S.vanity.color}" opacity=".85" stroke="${ink}" stroke-width=".6"`);
  o.push(`<ellipse cx="78" cy="10" rx="7" ry="5.2" fill="var(--panel)" stroke="${ink}" stroke-width=".5"/>`);
  text(78,24.8,`${S.vanity.w}″ VANITY`); }
  // door + swing
  line(92,W,92,W-30,`stroke="${ink}" stroke-width="1"`);
  o.push(`<path d="M92 ${W-30} A 30 30 0 0 0 62 ${W}" fill="none" stroke="${mut}" stroke-width=".35" stroke-dasharray="1.2 1"/>`);
  text(77,W+9.5,'30″ DOOR','font-size="2.8"');
  // dimension strings
  dimH(0,L,-24,'8′-0″');
  dimH(0,30,-13); dimH(30,46,-13); dimH(46,63,-13); dimH(63,93,-13); dimH(93,96,-13,'3″');
  dimV(0,W,-26,'5′-0″');
  dimV(0,21,104);
  dimH(62,92,W+15);
  text(L/2,W+26,'PLAN · SCALE: GRID IN INCHES · NORTH NOT SHOWN','font-size="2.6" fill="var(--muted)"');
  svg.innerHTML=o.join('');
  const notes = S.codeKey==='existing'
    ? ['Layout approximated from photos: tub across the end wall, toilet beside it, sink near the door. Field measure before pricing.','Door swings in beside the tub.','All four walls and the ceiling are tiled today, which adds demo time and dumpster weight.']
    : S.wet==='tub'
    ? ['Tub, toilet and vanity all stay on existing walls, so drains and supply lines stay close to where they are now.','Toilet centerline 16″ from tub and 17″ from vanity (15″ min each side).','30″ door swings in and clears the vanity front by 9″.']
    : ['Tub comes out; shower uses the same 30″×60″ footprint with a 4″ curb and a linear drain.','Glass: fixed 35″ panel by the toilet, 24″ door at the front that swings out into the open floor, clear of the toilet.','Toilet and vanity stay put, so only the wet-area plumbing moves.'];
  document.getElementById('plan-notes').innerHTML=notes.map(n=>`<li>${n}</li>`).join('');
}
const WETD=30;

/* ---------- Camera views ---------- */
const VIEWS={
  over:{pos:[150,170,190],tgt:[L/2,30,W/2]},
  door:{pos:[L-18,62,W+70],tgt:[40,40,10]},
  wet:{pos:[70,58,W+40],tgt:[8,45,W/2]},
  plan:{pos:[L/2,330,W/2+0.01],tgt:[L/2,0,W/2]}
};
let anim=null;
function setView(k,instant){
  const v=VIEWS[k]; const from={p:camera.position.clone(),t:controls.target.clone()};
  const to={p:new THREE.Vector3(...v.pos),t:new THREE.Vector3(...v.tgt)};
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===k));
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(instant||reduce){ camera.position.copy(to.p); controls.target.copy(to.t); controls.update(); return; }
  const t0=performance.now(); anim=(now)=>{ const u=Math.min(1,(now-t0)/700), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    camera.position.lerpVectors(from.p,to.p,e); controls.target.lerpVectors(from.t,to.t,e); if(u>=1) anim=null; };
}
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.style-btn').forEach(x=>x.setAttribute('aria-pressed',x===b));
  build(b.dataset.style); 
}));

function resize(){ const w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);



let start='modern';
document.querySelectorAll('.style-btn').forEach(x=>x.setAttribute('aria-pressed',x.dataset.style===start));
build(start); resize(); setView('over',true);
(function loop(now){ requestAnimationFrame(loop); if(anim) anim(now); controls.update(); renderer.render(scene,camera); })(performance.now());
})();

</script>
<script>
(function(){
  const stage=document.getElementById('stage'), layer=document.getElementById('plan-layer'), views=document.getElementById('views');
  const m3=document.getElementById('m-3d'), mp=document.getElementById('m-plan');
  function mode(plan){ layer.hidden=!plan; views.hidden=plan; m3.setAttribute('aria-pressed',!plan); mp.setAttribute('aria-pressed',plan); post(); }
  m3.addEventListener('click',()=>mode(false)); mp.addEventListener('click',()=>mode(true));
  // tell the parent page how tall this is, so the embed never needs its own scrollbar
  function post(){ try{ parent.postMessage({hiBathDesigner:true,height:document.getElementById('dz').offsetHeight+2},'*'); }catch(e){} }
  new ResizeObserver(post).observe(document.getElementById('dz'));
  document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>setTimeout(post,50)));
  post();
})();
</script>
