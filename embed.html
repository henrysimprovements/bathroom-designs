<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bathroom Style Designer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700;800;900&display=swap">
<style>
/* Henry's Improvements look: black, white line work, blueprint grid */
:root{
  --bg:#000000; --panel:#050608; --ink:#ffffff; --silver:#cbd5e1; --muted:#94a3b8;
  --line:rgba(255,255,255,0.16); --line-2:rgba(255,255,255,0.10); --accent:#ffffff;
  --f:'Fira Sans', Arial, sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0;font-family:var(--f);-webkit-font-smoothing:antialiased;line-height:1.6}
.dz{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#000}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line-2)}
.style-btn{appearance:none;background:transparent;border:0;border-left:1px solid var(--line-2);color:var(--muted);cursor:pointer;padding:18px 10px;font:800 0.78rem var(--f);letter-spacing:.16em;text-transform:uppercase;transition:color .3s,background-color .3s}
.style-btn:first-child{border-left:0}
.style-btn:hover{color:#fff}
.style-btn[aria-pressed="true"]{color:#000;background:#fff}
.style-btn:focus-visible,.pill:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.mood{margin:0;padding:16px 22px;text-align:center;color:var(--silver);font-weight:300;font-size:.96rem;border-bottom:1px solid var(--line-2)}
.stage{position:relative;aspect-ratio:16/10;width:100%;max-width:100%;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(80% 90% at 50% 40%,#11161a,#050608 70%)}
.stage canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y;cursor:grab}
.plan-layer{position:absolute;inset:0;padding:18px;background:linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px) 0 0/28px 28px,#050608;display:grid;place-items:center}
.plan-layer svg{width:100%;height:100%;display:block}
.plan-layer svg text{font-family:var(--f);font-weight:700;fill:#fff}
.badge{position:absolute;top:14px;left:14px;z-index:5;display:inline-flex;gap:8px;align-items:center;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:7px 14px;font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.badge b{font-weight:900}
.mode{position:absolute;top:14px;right:14px;z-index:5;display:flex;border:1px solid rgba(255,255,255,.35);border-radius:50px;overflow:hidden;background:rgba(0,0,0,.6)}
.views{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 28px)}
.pill{appearance:none;border:0;background:transparent;color:#fff;font:700 .66rem var(--f);letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.views .pill{border:1px solid rgba(255,255,255,.3);border-radius:50px;background:rgba(0,0,0,.55)}
.pill[aria-pressed="true"]{background:#fff!important;color:#000}
.hint{display:none}
.plan-layer[hidden],.views[hidden]{display:none!important}
.specs-row{display:grid;grid-template-columns:1.25fr 1fr 1fr;border-top:1px solid var(--line-2)}
.specs-row>div{padding:22px 22px 24px;border-left:1px solid var(--line-2);min-width:0}
.specs-row>div:first-child{border-left:0}
.lab{margin:0 0 12px;font-size:.7rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.specs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.specs li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start}
.sw{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.35);margin-top:3px}
.what{font-weight:600;font-size:.9rem;line-height:1.35}
.where{color:var(--muted);font-size:.8rem;font-weight:300}
.qty{display:none}
.finish{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.finish div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.finish div span:first-child{color:var(--muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.14em;font-weight:700;padding-top:2px}
.finish div span:last-child{text-align:right;font-weight:300}
#s-code{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--silver);font-size:.86rem;font-weight:300}
#plan-notes{display:none}
.foot{margin:0;padding:14px 22px;border-top:1px solid var(--line-2);font-size:.74rem;color:rgba(148,163,184,.85);font-weight:300;text-align:center}
@media (max-width:760px){
  .style-btn{padding:15px 4px;font-size:.64rem;letter-spacing:.08em}
  .stage{aspect-ratio:1/1}
  .specs-row{grid-template-columns:minmax(0,1fr)}
  .specs-row>div{border-left:0;border-top:1px solid var(--line-2)}
  .specs-row>div:first-child{border-top:0}
  .pill{font-size:.6rem;padding:6px 10px;letter-spacing:.08em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.suppliers{display:flex;flex-wrap:wrap;gap:10px 30px;align-items:center;justify-content:center;padding:18px 22px;border-top:1px solid rgba(255,255,255,0.10)}
.sup-lab{font-size:.68rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#94a3b8}
.brand{font-weight:800;font-size:.84rem;letter-spacing:.14em;text-transform:uppercase;color:#fff}
</style>
</head><body>

  <div class="tabs" role="group" aria-label="Choose a style">
    <button class="style-btn" id="btn-modern" data-style="modern" aria-pressed="true">Modern Marble</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const stage = document.getElementById('stage');
if(!window.THREE){ stage.insertAdjacentHTML('beforeend','<div class="err">The 3D viewer could not load. Check your connection and reload the page.</div>'); return; }

/* ---------- Room in inches: x = 168 (length, 14′), z = 144 (width, 12′), y = 108 (9′ ceiling) ---------- */
const L=168, W=144, H=108;

/* ---------- Seeded random so textures stay the same between loads ---------- */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,amt){ const [r,g,b]=hex2rgb(h); const f=v=>Math.max(0,Math.min(255,Math.round(v+amt))); return `rgb(${f(r)},${f(g)},${f(b)})`; }

/* Each texture canvas represents `span` inches square; repeat set from surface size. */
const PX=1024;
function makeTex(opts){
  const c=document.createElement('canvas'); c.width=c.height=PX; const g=c.getContext('2d');
  const r=rng(opts.seed||7); const s=PX/opts.span;
  g.fillStyle=opts.grout; g.fillRect(0,0,PX,PX);
  const gw=Math.max(1.5,(opts.groutIn||0.125)*s);
  const fillPiece=(path)=>{ g.save(); path(); g.clip(); g.fillStyle=shade(opts.base,(r()-0.5)*(opts.vary||10)); g.fillRect(0,0,PX,PX); g.restore(); };
  const rect=(x,y,w,h)=>fillPiece(()=>{ g.beginPath(); g.rect(x*s+gw/2,y*s+gw/2,w*s-gw,h*s-gw); });
  const p=opts.pattern;
  if(p==='grid'||p==='brick'||p==='stack'){
    const tw=opts.tw, th=opts.th;
    for(let row=0,y=0;y<opts.span;row++,y+=th){
      const off=(p==='brick'&&row%2)?tw/2:0;
      for(let x=-off;x<opts.span;x+=tw) rect(x,y,tw,th);
    }
  } else if(p==='herringbone'){
    const a=opts.tw, Lp=opts.th; // a = width, Lp = length
    g.save(); g.translate(PX/2,PX/2); g.rotate(Math.PI/4); g.translate(-PX,-PX);
    const S2=opts.span*2.2;
    for(let k=-60;k<60;k++) for(let m=-12;m<12;m++){
      const ox=m*Lp, oy=-m*Lp;
      const hx=k*a+ox, hy=k*a+oy;
      if(hx<-Lp||hx>S2+Lp||hy<-Lp||hy>S2+Lp) continue;
      rect(hx,hy,Lp,a); rect(hx-a,hy,a,Lp);
    }
    g.restore();
  } else if(p==='hex'){
    const R=opts.tw/2, hh=Math.sqrt(3)*R;
    for(let col=0,x=0;x<opts.span+R*2;col++,x+=1.5*R){
      for(let y=(col%2?hh/2:0)-hh;y<opts.span+hh;y+=hh){
        fillPiece(()=>{ g.beginPath(); for(let i=0;i<6;i++){ const ang=Math.PI/3*i; const rr=R*s-gw/2; g.lineTo(x*s+Math.cos(ang)*rr,y*s+Math.sin(ang)*rr);} g.closePath(); });
      }
    }
  }
  // veining / speckle on top of the pieces, leaving grout lines visible
  if(opts.veins){
    g.save(); g.globalCompositeOperation='source-atop';
    for(let i=0;i<opts.veins.count;i++){
      g.strokeStyle=opts.veins.color; g.globalAlpha=0.25+r()*0.5; g.lineWidth=0.6+r()*opts.veins.width;
      g.beginPath(); let x=r()*PX, y=r()*PX; g.moveTo(x,y);
      for(let k=0;k<6;k++){ const nx=x+(r()-0.3)*PX*0.35, ny=y+(r()-0.5)*PX*0.25; g.quadraticCurveTo((x+nx)/2+(r()-0.5)*80,(y+ny)/2+(r()-0.5)*80,nx,ny); x=nx; y=ny; }
      g.stroke();
    }
    g.restore();
  }
  if(opts.grain){
    g.save(); g.globalCompositeOperation='source-atop';
    for(let i=0;i<opts.grain.n;i++){ g.strokeStyle=opts.grain.color; g.globalAlpha=0.06+r()*0.2; g.lineWidth=0.6+r()*2; g.beginPath(); let y=r()*PX; g.moveTo(0,y); for(let x=0;x<=PX;x+=40){ y+=(r()-0.5)*5; g.lineTo(x,y);} g.stroke(); }
    g.restore();
  }
  if(opts.speckle){
    for(let i=0;i<opts.speckle.n;i++){ g.globalAlpha=0.08+r()*0.18; g.fillStyle=r()>0.5?opts.speckle.a:opts.speckle.b; const rr=0.5+r()*opts.speckle.size; g.beginPath(); g.arc(r()*PX,r()*PX,rr,0,7); g.fill(); }
    g.globalAlpha=1;
  }
  // regrout lines on top so speckle doesn't cover joints in grids
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; t.encoding=THREE.sRGBEncoding;
  t.userData={span:opts.span}; return t;
}
function woodTex(base,dark,seed){
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d'); const r=rng(seed);
  g.fillStyle=base; g.fillRect(0,0,512,512);
  for(let i=0;i<140;i++){ g.strokeStyle=dark; g.globalAlpha=0.05+r()*0.18; g.lineWidth=0.5+r()*2.5; g.beginPath(); let y=r()*512; g.moveTo(0,y); for(let x=0;x<=512;x+=32){ y+= (r()-0.5)*6; g.lineTo(x,y);} g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; return t;
}
function texFor(tex,w,h){ const t=tex.clone(); t.needsUpdate=true; t.repeat.set(w/tex.userData.span,h/tex.userData.span); return t; }

/* ---------- Style definitions ---------- */
/* sf = tile area in square feet for the sample room; boxSF = coverage per box when the catalog lists it */
const STYLES={
  modern:{
    name:'Modern Marble', mood:'Bright and dramatic. Marble-look slabs from floor to ceiling, a freestanding soaking tub under the window, a walk-in glass shower and a floating double vanity with matte black trim.',

    wallTile:{label:'Leon Calacatta Bamboo', size:'24×48 porcelain, Antique finish', where:'Shower, tub wall and vanity wall, to the ceiling', sf:197, boxSF:15.5, sw:'#f1eee8',
      tex:{pattern:'stack',tw:48,th:24,span:96,base:'#f1eee8',grout:'#e3ded6',groutIn:0.0625,vary:4,seed:11,veins:{count:16,color:'#b3a27f',width:1.6}}},
    floorTile:{label:'Leon Grigio Etrusco', size:'24×24 porcelain', where:'Main floor', sf:146, boxSF:11.63, sw:'#7d7a76',
      tex:{pattern:'grid',tw:24,th:24,span:48,base:'#7d7a76',grout:'#6b6965',groutIn:0.0625,vary:8,seed:21,veins:{count:30,color:'#d8d4cd',width:1.4}}},
    accentTile:{label:'Hex & Herringbone Seta Nera 1″ hex', size:'Natural stone mosaic, 12×12 sheet', where:'Shower floor and niche', sf:25, sw:'#2a2a2c',
      tex:{pattern:'hex',tw:1,th:1,span:12,base:'#2c2c2e',grout:'#5a5a5c',groutIn:0.06,vary:10,seed:31}},
    vanity:{kind:'float',color:'#f4f2ee',wood:null,top:'#fafafa',glow:true}, mirror:'rect', metal:'#1b1b1b', metalRough:0.45,
    tub:{ext:'#fbfbfa',feet:false},
    finish:[['Tub','72″ freestanding oval soaker, floor-mount filler'],['Shower','66″×48″ walk-in, rain head + handheld, tiled bench'],['Glass','Frameless panels and door, cut by H2 LLC'],['Vanity','72″ floating double, matte white, LED under-glow'],['Top','White quartz, two undermount sinks'],['Waterproofing','Schluter-KERDI system'],['Fixtures','Matte black']]
  },
  spa:{
    name:'Spa Retreat', mood:'Warm and calm, like a hotel spa. Limestone-look walls, a stone-tone freestanding tub, a walk-in shower with a teak bench and an oak double vanity.',
    paint:'#c9cfbf', trim:'#f3efe7', vanityWall:'none', bench:'teak', pendant:'drum',
    wallTile:{label:'Bryce Sable', size:'24×48 limestone-look porcelain, Matte-Pro', where:'Shower and tub wall, to the ceiling', sf:143, sw:'#cdbfa8',
      tex:{pattern:'brick',tw:48,th:24,span:96,base:'#cdbfa8',grout:'#bfb19a',groutIn:0.0625,vary:7,seed:41,speckle:{n:2600,a:'#a89a82',b:'#e4dac8',size:1.6}}},
    floorTile:{label:'Bryce Champagne', size:'12×24 porcelain, C2 GRIP', where:'Main floor', sf:146, sw:'#e2d8c6',
      tex:{pattern:'brick',tw:24,th:12,span:48,base:'#e2d8c6',grout:'#cdbfa8',groutIn:0.125,vary:8,seed:51,speckle:{n:1500,a:'#bfae93',b:'#f2ebdf',size:1.4}}},
    accentTile:{label:'Bryce chevron mosaic', size:'10×12-4/5 mosaic sheet', where:'Shower floor and niche', sf:25, sw:'#d8ccb6',
      tex:{pattern:'herringbone',tw:1.5,th:4.5,span:12,base:'#d6c9b2',grout:'#b9ab93',groutIn:0.0625,vary:12,seed:61}},
    vanity:{kind:'float',color:'#b88c5e',wood:['#c09668','#8a6440'],top:'#f2eee6',glow:false}, mirror:'round', metal:'#b9b6b0', metalRough:0.3,
    tub:{ext:'#ddd5c7',feet:false},
    finish:[['Tub','72″ freestanding, stone-tone finish'],['Shower','66″×48″ walk-in, rain head + handheld, teak bench'],['Glass','Frameless panels and door, cut by H2 LLC'],['Vanity','72″ floating double, oak-look'],['Top','Quartz, two undermount sinks'],['Waterproofing','Schluter-KERDI system'],['Fixtures','Brushed nickel'],['Paint','Soft sage, satin']]
  },
  classic:{
    name:'Transitional', mood:'Timeless with a little glamour. Stacked white tile, a natural-stone herringbone floor, a navy tub on brass feet and a navy shaker double vanity with brass.',
    paint:'#e9e6e0', trim:'#ffffff', vanityWall:'wainscot', bench:'tile', pendant:'lantern',
    wallTile:{label:'Leon Lilac White', size:'4×24 porcelain, stacked', where:'Shower and tub wall to the ceiling, vanity wainscot', sf:170, boxSF:9.04, sw:'#f4f2ee',
      tex:{pattern:'stack',tw:24,th:4,span:48,base:'#f3f1ed',grout:'#d6d3cd',groutIn:0.0625,vary:5,seed:71,veins:{count:10,color:'#c9c2cf',width:1.0}}},

      tex:{pattern:'herringbone',tw:3,th:9,span:36,base:'#a9adb0',grout:'#d0d0cc',groutIn:0.0625,vary:14,seed:81,veins:{count:20,color:'#e6e6e2',width:1.0}}},
    accentTile:{label:'Hex & Herringbone Grigio Cielo', size:'Herringbone, natural stone (seal it)', where:'Shower floor, one slope to a linear drain', sf:25, sw:'#a9adb0',
      tex:{pattern:'herringbone',tw:3,th:9,span:36,base:'#a9adb0',grout:'#d0d0cc',groutIn:0.0625,vary:14,seed:82,veins:{count:20,color:'#e6e6e2',width:1.0}}},

    finish:[['Tub','72″ freestanding, navy exterior on brass feet'],['Shower','66″×48″ walk-in, rain head + handheld, tiled bench'],['Glass','Frameless panels and door, cut by H2 LLC'],['Vanity','72″ navy shaker double, brass pulls'],['Top','Carrara-look quartz'],['Waterproofing','Schluter-KERDI system'],['Fixtures','Brushed brass'],['Paint','Greige walls, white trim']]
  }
};
const CODE=['Permits and inspections with your town, start to finish.','Licensed plumber and electrician for the tub filler, shower valves, drains, fan and lighting.','Schluter-KERDI waterproofing on the shower walls and floor, flood-tested before tile goes in.','Tempered, labeled glass on the shower.','We check the floor framing before a heavy freestanding tub goes in.'];

/* ---------- Three.js setup ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,4/3,1,3000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=40; controls.maxDistance=760;

scene.add(new THREE.HemisphereLight(0xfff8ee,0x9a948a,0.55));
const sun=new THREE.DirectionalLight(0xfff3e2,0.62); sun.position.set(L/2+150,320,W/2+210); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:10,far:900}); sun.target.position.set(L/2,0,W/2); scene.add(sun,sun.target);
const bulb=new THREE.PointLight(0xffe9cc,0.5,420,1.4); bulb.position.set(L/2,H-10,W/2+10); scene.add(bulb);
const vanityLight=new THREE.PointLight(0xfff0d8,0.35,150,2); scene.add(vanityLight);
const windowLight=new THREE.PointLight(0xe6f1ff,0.3,200,2); windowLight.position.set(114,70,24); scene.add(windowLight);

let room=new THREE.Group(); scene.add(room);
/* section-cut wall caps and floor slab so the room reads clearly against the dark stage */
(function(){ const cap=new THREE.MeshStandardMaterial({color:0xf4f2ee,roughness:0.7}); const T=4.5;
  const add=(w,h,d,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),cap); m.position.set(x,y,z); m.castShadow=true; scene.add(m); };
  add(L+T,1,T,L/2-T/2,H+0.5,-T/2); add(T,1,W+T,-T/2,H+0.5,W/2-T/2);
  add(T,H,T,-T/2,H/2,-T/2); add(T,H+1,1,-T/2,(H+1)/2,W+0.5); add(1,H+1,T,L+0.5,(H+1)/2,-T/2);
  add(L+2*T,4,W+2*T,L/2,-2.05,W/2);
})();
const std=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:0.6,metalness:0},o));
function box(w,h,d,mat,x,y,z,parent){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; (parent||room).add(m); return m; }
function plane(w,h,mat,pos,rotY,rotX,parent){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.position.copy(pos); if(rotY) m.rotation.y=rotY; if(rotX) m.rotation.x=rotX; m.receiveShadow=true; (parent||room).add(m); return m; }
function cyl(rt,rb,h,mat,x,y,z,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||28),mat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; room.add(m); return m; }
/* a wall surface with rectangular openings (window, niche); holes are [x0,y0,x1,y1] in the plane's own coordinates */
function holedPlane(w,h,mat,pos,rotY,holes){
  const sh=new THREE.Shape(); sh.moveTo(-w/2,-h/2); sh.lineTo(w/2,-h/2); sh.lineTo(w/2,h/2); sh.lineTo(-w/2,h/2); sh.lineTo(-w/2,-h/2);
  for(const [x0,y0,x1,y1] of holes){ const p=new THREE.Path(); p.moveTo(x0,y0); p.lineTo(x0,y1); p.lineTo(x1,y1); p.lineTo(x1,y0); p.lineTo(x0,y0); sh.holes.push(p); }
  const g=new THREE.ShapeGeometry(sh), uv=g.attributes.uv, p=g.attributes.position;
  for(let i=0;i<uv.count;i++) uv.setXY(i,p.getX(i)/w+0.5,p.getY(i)/h+0.5);
  const m=new THREE.Mesh(g,mat); m.position.copy(pos); if(rotY) m.rotation.y=rotY; m.receiveShadow=true; room.add(m); return m;
}

  gp(37,0.4,18.5,SZ); gp(27,0.4,SX-14.5,SZ+0.6); gp(0.4,SZ-1,SX,SZ/2-0.5);
  box(0.6,12,0.8,metal,SX-26,44,SZ+1.4);

  const lift=S.tub.feet?4:0;

  const shell=new THREE.Mesh(new THREE.CylinderGeometry(TD/2,TD/2-3,22,48,1,true),ext); shell.position.set(TX,11+lift,TZ); shell.scale.x=TL/TD; shell.castShadow=shell.receiveShadow=true; room.add(shell);
  const inner=new THREE.Mesh(new THREE.CylinderGeometry(TD/2-1.6,TD/2-5,19,48,1,true),std({color:'#fbfbfa',roughness:0.18,side:THREE.BackSide})); inner.position.set(TX,12.5+lift,TZ); inner.scale.x=(TL-3.2)/(TD-3.2); room.add(inner);
  const tfloor=cyl(TD/2-5,TD/2-5,0.4,porcelain,TX,3.2+lift,TZ,48); tfloor.scale.x=(TL-10)/(TD-10);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(TD/2-0.8,0.9,10,64),porcelain); rim.rotation.x=Math.PI/2; rim.position.set(TX,22+lift,TZ); rim.scale.x=(TL-1.6)/(TD-1.6); rim.castShadow=true; room.add(rim);

  cyl(0.9,0.6,6,metal,fx+1.6,30,TZ,12); box(1.6,1.6,1.6,metal,fx,26,TZ);
  // pendant over the tub
  if(S.pendant!=='ring') cyl(0.25,0.25,26,metal,TX,H-13,TZ,8);
  const glow=std({color:'#fff4dc',emissive:'#ffdca0',emissiveIntensity:0.9});
  if(S.pendant==='ring'){ const r=new THREE.Mesh(new THREE.TorusGeometry(11,0.7,10,64),glow); r.rotation.x=Math.PI/2; r.position.set(TX,H-26,TZ); room.add(r);
    for(const a of [0,2.09,4.19]) cyl(0.12,0.12,26,metal,TX+Math.cos(a)*11,H-13,TZ+Math.sin(a)*11,6); }
  else if(S.pendant==='drum'){ cyl(9,9,10,std({color:'#c8a878',roughness:0.9,side:THREE.DoubleSide}),TX,H-30,TZ,40); cyl(8.6,8.6,0.3,glow,TX,H-35,TZ,40); }
  else { box(9,12,9,std({color:'#fffaf0',emissive:'#ffe2b0',emissiveIntensity:0.5,transparent:true,opacity:0.6}),TX,H-32,TZ); for(const dx of [-4.5,4.5]) for(const dz of [-4.5,4.5]) box(0.5,13,0.5,metal,TX+dx,H-32,TZ+dz); box(10,0.8,10,metal,TX,H-25.6,TZ); box(10,0.8,10,metal,TX,H-38.4,TZ); }

/* ---------- 2D dimensioned floor plan ---------- */
function ftin(i){ const f=Math.floor(i/12), r=Math.round(i-f*12); return f? `${f}′-${r}″` : `${r}″`; }
function drawPlan(key){
  const S=STYLES[key], svg=document.getElementById('plan-svg');
  svg.setAttribute('viewBox','-46 -50 262 250');
  const ink='var(--ink)', mut='var(--muted)', FS=5;
  const o=[];
  const rect=(x,y,w,h,a)=>o.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${a||''}/>`);
  const line=(x1,y1,x2,y2,a)=>o.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${a||''}/>`);
  const text=(x,y,t,a)=>o.push(`<text x="${x}" y="${y}" font-size="${FS}" text-anchor="middle" ${a||''}>${t}</text>`);
  const tick=(x,y)=>line(x-1.8,y+1.8,x+1.8,y-1.8,`stroke="${ink}" stroke-width=".7"`);
  const dimH=(x1,x2,y,lab)=>{ line(x1,y,x2,y,`stroke="${mut}" stroke-width=".5"`); for(const x of [x1,x2]){ line(x,y-3,x,y+3,`stroke="${mut}" stroke-width=".5"`); tick(x,y);} text((x1+x2)/2,y-2,lab||ftin(x2-x1),'font-size="4.4"'); };
  const dimV=(y1,y2,x,lab)=>{ line(x,y1,x,y2,`stroke="${mut}" stroke-width=".5"`); for(const y of [y1,y2]){ line(x-3,y,x+3,y,`stroke="${mut}" stroke-width=".5"`); tick(x,y);} o.push(`<text x="${x-2}" y="${(y1+y2)/2}" font-size="4.4" text-anchor="middle" transform="rotate(-90 ${x-2} ${(y1+y2)/2})">${lab||ftin(y2-y1)}</text>`); };
  const st=`fill="none" stroke="${ink}" stroke-width=".8"`;
  // walls 4.5″ thick, window and door openings
  rect(-4.5,-4.5,L+9,W+9,`fill="${ink}" opacity=".88"`);
  rect(0,0,L,W,`fill="var(--panel)"`);
  rect(WIN[0],-4.5,WIN[2]-WIN[0],4.5,`fill="var(--panel)" stroke="${ink}" stroke-width=".5"`); line(WIN[0],-2.25,WIN[2],-2.25,`stroke="${ink}" stroke-width=".5"`);
  rect(DOOR[0],W-0.5,DOOR[1]-DOOR[0],5.5,`fill="var(--panel)"`);
  // shower
  rect(0,0,SX,SZ,`fill="${S.accentTile.sw}" opacity=".5"`);
  line(0,SZ,37,SZ,`stroke="${ink}" stroke-width="1.4"`); line(SX-28,SZ+0.6,SX-1,SZ+0.6,`stroke="${ink}" stroke-width="1.4"`); line(SX,0,SX,SZ-1,`stroke="${ink}" stroke-width="1.4"`);
  o.push(`<path d="M${SX-1} ${SZ+0.6} A 27 27 0 0 1 ${SX-28} ${SZ+27.6}" fill="none" stroke="${mut}" stroke-width=".5" stroke-dasharray="1.6 1.2"/>`);
  rect(0,1,15,SZ-2,`fill="${S.bench==='teak'?'#c09668':S.wallTile.sw}" stroke="${ink}" stroke-width=".5"`);
  rect(SX/2+6-18,SZ-5.2,36,2.4,`fill="${ink}"`);
  rect(-4,NICHE[0],4,NICHE[2]-NICHE[0],`fill="var(--panel)" stroke="${ink}" stroke-width=".5"`);
  text(SX/2+6,SZ/2-2,'WALK-IN SHOWER'); text(SX/2+6,SZ/2+4.5,'66″ × 48″','font-size="4.2"');
  text(7.5,SZ/2+2,'BENCH','font-size="3.4" transform="rotate(-90 7.5 '+(SZ/2+2)+')"');
  text(SX/2+6,SZ-7.5,'LINEAR DRAIN','font-size="3.2"'); text(-15,(NICHE[0]+NICHE[2])/2+1.2,'NICHE','font-size="3.6"');
  // tub + filler
  o.push(`<ellipse cx="${TX}" cy="${TZ}" rx="${TL/2}" ry="${TD/2}" ${st} fill="${S.tub.ext}" fill-opacity=".25"/>`);
  o.push(`<ellipse cx="${TX}" cy="${TZ}" rx="${TL/2-4}" ry="${TD/2-4}" ${st}/>`);
  o.push(`<circle cx="${TX+TL/2+4}" cy="${TZ}" r="2.2" fill="${ink}"/>`);
  text(TX,TZ+1.8,'FREESTANDING TUB'); text(TX,TZ+8,'72″ × 36″','font-size="4.2"');
  // vanity
  rect(0,VZ0,VD,VZ1-VZ0,`fill="${S.vanity.wood?S.vanity.wood[0]:S.vanity.color}" opacity=".85" stroke="${ink}" stroke-width=".8"`);
  for(const z of SINKS) o.push(`<ellipse cx="${VD/2+1}" cy="${z}" rx="5.2" ry="7" fill="var(--panel)" stroke="${ink}" stroke-width=".6"/>`);
  o.push(`<text x="${VD+7}" y="${(VZ0+VZ1)/2}" font-size="${FS}" text-anchor="middle" transform="rotate(-90 ${VD+7} ${(VZ0+VZ1)/2})">72″ DOUBLE VANITY</text>`);
  // toilet + privacy wall
  rect(138,PART-2.25,L-138,4.5,`fill="${ink}" opacity=".88"`);
  rect(L-8.3,TOIL-7.5,7.5,15,`${st} rx="1"`); o.push(`<ellipse cx="${L-17}" cy="${TOIL}" rx="10" ry="7" ${st}/>`);
  line(L+4.5,TOIL,L-30,TOIL,`stroke="${mut}" stroke-width=".4" stroke-dasharray="3 1 .6 1"`);
  text(L-15,PART+10,'WC','font-size="4.2"');
  // door + swing
  line(DOOR[1],W,DOOR[1],W-36,`stroke="${ink}" stroke-width="1.2"`);
  o.push(`<path d="M${DOOR[1]} ${W-36} A 36 36 0 0 0 ${DOOR[0]} ${W}" fill="none" stroke="${mut}" stroke-width=".5" stroke-dasharray="1.6 1.2"/>`);
  text((DOOR[0]+DOOR[1])/2,W+13,'36″ DOOR','font-size="4.2"');
  text((WIN[0]+WIN[2])/2,-8,'WINDOW','font-size="3.6"');

  dimH(0,L,-38,'14′-0″');
  dimH(0,SX,-24); dimH(SX,TX-TL/2,-24,'12″'); dimH(TX-TL/2,TX+TL/2,-24); dimH(TX+TL/2,L,-24,'18″');

  dimV(0,SZ,-24); dimV(SZ,VZ0,-24,'14″'); dimV(VZ0,VZ1,-24); dimV(VZ1,W,-24,'10″');
  dimV(PART+2.25,W,L+14); dimV(TOIL,W,L+26,'22″ TO ℄');

  text(L/2,W+36,'PLAN · 12′ × 14′ PRIMARY BATH · DIMENSIONS TO FINISHED FACES','font-size="3.8" fill="var(--muted)"');

  const notes=[
    'Walk-in shower in the corner with frameless glass, a tiled or teak bench, a recessed niche and a linear drain.',

    '72″ double vanity on its own wall with two sinks and two mirrors. Toilet sits behind a 54″ privacy wall by the door, 22″ to centerline (15″ min).'
  ];
  document.getElementById('plan-notes').innerHTML=notes.map(n=>`<li>${n}</li>`).join('');
}

/* ---------- Camera views ---------- */
const VIEWS={
  over:{pos:[262,215,290],tgt:[L/2,26,W/2]},
  door:{pos:[102,64,W+60],tgt:[100,42,20]},
  wet:{pos:[132,62,104],tgt:[46,40,22]},
  plan:{pos:[L/2,440,W/2+0.01],tgt:[L/2,0,W/2]}
};
let anim=null;
function setView(k,instant){
  const v=VIEWS[k]; const from={p:camera.position.clone(),t:controls.target.clone()};
  const to={p:new THREE.Vector3(...v.pos),t:new THREE.Vector3(...v.tgt)};
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===k));
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(instant||reduce){ camera.position.copy(to.p); controls.target.copy(to.t); controls.update(); return; }
  const t0=performance.now(); anim=(now)=>{ const u=Math.min(1,(now-t0)/700), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    camera.position.lerpVectors(from.p,to.p,e); controls.target.lerpVectors(from.t,to.t,e); if(u>=1) anim=null; };
}
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.style-btn').forEach(x=>x.setAttribute('aria-pressed',x===b));
  build(b.dataset.style); 
}));

function resize(){ const w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);



let start='modern';
document.querySelectorAll('.style-btn').forEach(x=>x.setAttribute('aria-pressed',x.dataset.style===start));
build(start); resize(); setView('over',true);
(function loop(now){ requestAnimationFrame(loop); if(anim) anim(now); controls.update(); renderer.render(scene,camera); })(performance.now());
})();

</script>
<script>
(function(){
  const stage=document.getElementById('stage'), layer=document.getElementById('plan-layer'), views=document.getElementById('views');
  const m3=document.getElementById('m-3d'), mp=document.getElementById('m-plan');
  function mode(plan){ layer.hidden=!plan; views.hidden=plan; m3.setAttribute('aria-pressed',!plan); mp.setAttribute('aria-pressed',plan); post(); }
  m3.addEventListener('click',()=>mode(false)); mp.addEventListener('click',()=>mode(true));
  // tell the parent page how tall this is, so the embed never needs its own scrollbar
  function post(){ try{ parent.postMessage({hiBathDesigner:true,height:document.getElementById('dz').offsetHeight+2},'*'); }catch(e){} }
  new ResizeObserver(post).observe(document.getElementById('dz'));
  document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>setTimeout(post,50)));
  post();
})();
</script>
